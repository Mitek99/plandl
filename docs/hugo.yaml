baseURL: https://plandl.org/
title: PlanDL
enableGitInfo: true
# Tags and categories are unused; without this Hugo publishes empty /tags/ and /categories/ pages.
disableKinds:
  - taxonomy
  - term
outputs:
  home: [html, rss, llms]
module:
  imports:
    - path: github.com/imfing/hextra
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Examples
      pageRef: /examples
      weight: 2
    - name: History
      pageRef: /history
      weight: 3
    - name: GitHub
      url: https://github.com/Mitek99/plandl
      weight: 4
      params:
        icon: github
params:
  homeTitle: "PlanDL – a floor-plan language for LLM agents"
  description: "PlanDL is a small, strict language for floor plans that LLM agents can write. Rooms sit on a grid; the compiler checks the plan works as a home and renders SVG."
  search:
    enable: false
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: favicon.svg
      width: 24
      height: 24
  footer:
    displayCopyright: false
    displayPoweredBy: false
  editURL:
    enable: true
    base: https://github.com/Mitek99/plandl/edit/main/docs/content

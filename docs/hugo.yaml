baseURL: https://plandl.org/
title: PlanDL
module:
  imports:
    - path: github.com/imfing/hextra
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Examples
      pageRef: /examples
      weight: 2
    - name: History
      pageRef: /history
      weight: 3
    - name: GitHub
      url: https://github.com/Mitek99/plandl
      weight: 4
      params:
        icon: github
params:
  search:
    enable: false
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: favicon.svg
      width: 24
      height: 24
  footer:
    displayCopyright: false
    displayPoweredBy: false
  editURL:
    enable: true
    base: https://github.com/Mitek99/plandl/edit/main/docs/content

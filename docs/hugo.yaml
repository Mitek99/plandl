baseURL: https://mitek99.github.io/plandl/
title: PlanDL
module:
  imports:
    - path: github.com/imfing/hextra
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Examples
      pageRef: /examples
      weight: 2
    - name: GitHub
      url: https://github.com/Mitek99/plandl
      weight: 3
      params:
        icon: github
params:
  search:
    enable: false
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    displayCopyright: false
    displayPoweredBy: true
  editURL:
    enable: true
    base: https://github.com/Mitek99/plandl/edit/main/docs/content

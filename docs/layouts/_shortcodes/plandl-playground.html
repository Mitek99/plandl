{{ $script := "playground.js" | relURL }}
{{ $styles := "playground.css" | relURL }}
<link rel="stylesheet" href="{{ $styles }}">
<div class="plandl-playground">
  <div class="plandl-editor">
    <label for="plandl-editor">PlanDL source</label>
    <textarea id="plandl-editor" rows="22" spellcheck="false">{{ readFile "static/examples/reference-house.plandl" }}</textarea>
  </div>
  <div class="plandl-preview">
    <div id="plandl-preview" aria-label="Rendered plan"></div>
    <label class="plandl-grid-label"><input type="checkbox" id="plandl-grid" checked> Grid lines</label>
    <p id="plandl-status" aria-live="polite"></p>
    <ul id="plandl-diagnostics"></ul>
  </div>
</div>
<script defer src="{{ $script }}"></script>

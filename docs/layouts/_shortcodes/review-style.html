{{- /* Styles for review pages in the History section: redlined plan sheets, numbered pins, and stat tiles. Call once near the top of the page. */ -}}
<style>
  .review-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid rgba(127, 127, 127, 0.3); border-radius: 6px; margin: 1.5rem 0; }
  .review-stat { padding: 14px 16px; border-right: 1px solid rgba(127, 127, 127, 0.3); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .review-stat:last-child { border-right: none; }
  .review-stat b { font-size: 1.7rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .review-stat b.red { color: #c8102e; }
  html.dark .review-stat b.red { color: #ff5c72; }
  .review-stat span { font-size: 0.85rem; line-height: 1.35; opacity: 0.8; }
  @media (max-width: 760px) {
    .review-stats { grid-template-columns: 1fr 1fr; }
    .review-stat:nth-child(2) { border-right: none; }
    .review-stat:nth-child(-n+2) { border-bottom: 1px solid rgba(127, 127, 127, 0.3); }
  }
  .review-sheet { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); border: 1px solid rgba(127, 127, 127, 0.3); border-radius: 6px; overflow: hidden; margin: 1.75rem 0; }
  .review-sheet.wide { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 820px) { .review-sheet { grid-template-columns: minmax(0, 1fr); } }
  .review-draw { background: #ffffff; padding: 12px; display: flex; flex-direction: column; justify-content: center; gap: 8px; min-width: 0; }
  .review-draw img { width: 100%; height: auto; margin: 0 !important; border-radius: 0 !important; }
  .review-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 620px) { .review-pair { grid-template-columns: minmax(0, 1fr); } }
  .review-pair figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
  .review-pair figcaption { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.72rem; color: #485466; }
  .review-notes { padding: 14px 18px; font-size: 0.93rem; min-width: 0; }
  .review-sheet.wide .review-notes { border-bottom: 1px solid rgba(127, 127, 127, 0.3); }
  .review-cap { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.7; }
  .review-notes p { margin-top: 0.6rem !important; }
  .review-notes ul { list-style: none !important; padding-inline-start: 0 !important; margin-inline-start: 0 !important; }
  .review-notes li { margin-top: 0.45rem !important; padding-left: 1.9em; text-indent: -1.9em; }
  .review-pin { display: inline-block; width: 1.45em; height: 1.45em; border-radius: 50%; background: #c8102e; color: #ffffff; font-size: 0.72rem; font-weight: 700; line-height: 1.45em; text-align: center; text-indent: 0; margin-right: 0.45em; vertical-align: 0.12em; }
  .review-pin.soft { background: #b85c00; }
  .review-pin.text { background: #6b7280; }
</style>
